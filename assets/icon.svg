<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ant-py">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa6ff"/>
      <stop offset="0.55" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2b62d9"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- 开口圆环：右侧留缺口，让箭头从缺口穿出。
       环与箭头用不同颜色，16px 下才不会糊成一团白色。 -->
  <path d="M170 88 A52 52 0 1 0 170 168" fill="none"
        stroke="#ffffff" stroke-opacity="0.92" stroke-width="17"
        stroke-linecap="round"/>

  <path d="M118 128 H198" fill="none"
        stroke="#3ecf6f" stroke-width="21" stroke-linecap="round"/>
  <path d="M176 105 L200 128 L176 151" fill="none"
        stroke="#3ecf6f" stroke-width="21"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
