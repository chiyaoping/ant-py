name: build-android-apk

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'proxycore.py', 'paths.py', 'nodes.json', 'bypass_list.txt', 'config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy shared sources into android/ (flet build 打包 app 目录)
        run: |
          cp proxycore.py paths.py nodes.json bypass_list.txt config.json android/
          ls android/

      - name: Download hev-socks5-tunnel (arm64) into template jniLibs
        run: |
          JNI="android/flet-template/{{cookiecutter.out_dir}}/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          # 固定版本直链（CI 里 GitHub API 可能被限流，故优先直链，失败再查 API）
          URL="https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.1/hev-socks5-tunnel-android-arm64-v8a"
          if ! curl -fL --retry 3 -o "$JNI/libtun2socks.so" "$URL"; then
            echo "pinned URL failed, querying API..."
            URL=$(curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest \
              | grep browser_download_url | grep "android-arm64-v8a" | cut -d '"' -f 4 | head -1)
            echo "URL=$URL"
            curl -fL --retry 3 -o "$JNI/libtun2socks.so" "$URL"
          fi
          chmod +x "$JNI/libtun2socks.so"
          ls -la "$JNI"
          file "$JNI/libtun2socks.so" || true

      - name: Install flet CLI
        run: pip install "flet[all]==0.27.5" || pip install flet-cli==0.27.5

      - name: Build APK (flet build + 自带模板含 jniLibs)
        working-directory: android
        run: |
          flet build apk -v --module-name main --template "$PWD/flet-template"
          find build -name "*.apk" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antpy-apk
          path: android/build/**/outputs/**/*.apk
          if-no-files-found: error
