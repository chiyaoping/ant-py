name: build-android-apk

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'proxycore.py', 'paths.py', 'nodes.json', 'bypass_list.txt', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev gettext automake m4
        continue-on-error: false

      - name: Download hev-socks5-tunnel (arm64)
        run: |
          mkdir -p android/jniLibs/arm64-v8a
          URL=$(curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest \
            | grep browser_download_url | grep "android-arm64-v8a" | cut -d '"' -f 4 | head -1)
          echo "URL=$URL"
          if [ -z "$URL" ]; then
            echo "no android asset found, list all assets:"
            curl -s https://api.github.com/repos/hev-socks5/hev-socks5-tunnel/releases/latest | grep browser_download_url
            exit 1
          fi
          curl -L -o /tmp/tun2socks "$URL"
          cp /tmp/tun2socks android/jniLibs/arm64-v8a/libtun2socks.so
          ls -la android/jniLibs/arm64-v8a/

      - name: Copy shared sources into android/ (buildozer 只打包 source.dir 下的文件)
        run: |
          cp proxycore.py paths.py nodes.json bypass_list.txt android/
          ls android/

      - name: Install buildozer
        run: pip install --upgrade pip cython==0.29.36 virtualenv && pip install buildozer

      - name: Build APK
        working-directory: android
        run: |
          yes | buildozer android debug || buildozer android debug
          ls -la bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antpy-apk
          path: android/bin/*.apk
          if-no-files-found: error
