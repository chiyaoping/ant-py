name: build-android-apk

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'proxycore.py', 'paths.py', 'nodes.json', 'bypass_list.txt', 'config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy shared sources into android/ (flet build 打包 app 目录下所有文件)
        run: |
          cp proxycore.py paths.py nodes.json bypass_list.txt config.json android/
          ls android/

      - name: Download hev-socks5-tunnel (arm64)
        run: |
          mkdir -p android/jniLibs/arm64-v8a
          URL=$(curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest \
            | grep browser_download_url | grep "android-arm64-v8a" | cut -d '"' -f 4 | head -1)
          echo "URL=$URL"
          if [ -z "$URL" ]; then
            echo "no android asset found:"
            curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest | grep browser_download_url
            exit 1
          fi
          curl -L -o /tmp/tun2socks "$URL"
          cp /tmp/tun2socks android/jniLibs/arm64-v8a/libtun2socks.so
          ls -la android/jniLibs/arm64-v8a/

      - name: Install flet CLI
        run: pip install "flet[all]==0.27.5" || pip install flet-cli==0.27.5

      - name: Build APK (flet build,自动装 Flutter/JDK/Android SDK)
        working-directory: android
        run: |
          flet build apk -v --module-name main --template-ref 0.27.5
          find build -name "*.apk" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antpy-apk
          path: android/build/**/outputs/**/*.apk
          if-no-files-found: error
