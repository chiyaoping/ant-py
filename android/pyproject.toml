[project]
name = "antpy"
version = "1.0.0"
description = "ant-py proxy client for Android"

[tool.flet]
org = "org.antpy"
product = "ant-py"
permissions = ["internet", "wake_lock"]

[tool.flet.android]
split_per_abi = true

[tool.flet.android.permission]
# VPN 前台服务 + 通知
FOREGROUND_SERVICE = true

[tool.flet.flutter.pubspec]
# Flutter 3.27.4 (Dart 3.6) 与 webview_flutter_android 4.11+(Dart 3.9)冲突,锁旧版
dependency_overrides = { webview_flutter_android = "4.10.0" }
